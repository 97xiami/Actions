name: ImmortalWrt x86-64 固件编译

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动输入要编译的 ImmortalWrt tag，例如 v25.12.2'
        required: true
        type: string
        default: 'v25.12.2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 编译 ImmortalWrt
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      UPSTREAM_TAG: ${{ inputs.version }}
      RELEASE_TAG: immortalwrt-x86-64-${{ inputs.version }}-r${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 清理磁盘空间
        run: |
          set -euo pipefail
          df -hT
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -hT

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libelf-dev libncurses-dev libssl-dev libfuse-dev \
            python3 python3-dev python3-setuptools python3-pyelftools \
            rsync swig unzip zlib1g-dev file wget curl ca-certificates \
            xz-utils zstd ccache xsltproc qemu-utils dosfstools \
            autoconf automake autopoint libtool pkgconf help2man texinfo \
            libgmp-dev libmpc-dev libmpfr-dev device-tree-compiler genisoimage

      - name: 克隆指定的源码 tag
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "$UPSTREAM_TAG" "$REPO_URL" immortalwrt
          echo "SOURCE_COMMIT=$(git -C immortalwrt rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 更新并安装官方软件源
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 用 make defconfig 生成 x86-64 配置
        run: |
          set -euo pipefail
          cd immortalwrt
          # 直接 make defconfig 默认选中的是 mediatek，因此这里只写入
          # x86-64 的目标符号，其余默认项交由 defconfig 自动填充。
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_VHDX_IMAGES=y
          CONFIG_PACKAGE_luci-app-openclash=y
          EOF
          make defconfig
          ./scripts/diffconfig.sh > "$RUNNER_TEMP/x86-64.diffconfig"
          # 修复ERROR: package/feeds/packages/rust [host] failed to build.
          sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' feeds/packages/lang/rust/Makefile

      - name: 下载源码包
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)" || make download -j1 V=s

      - name: 编译固件
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: 整理固件与构建信息
        env:
          CONFIG_COMMIT: ${{ github.sha }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          target_dir="$GITHUB_WORKSPACE/immortalwrt/bin/targets/x86/64"
          mkdir -p "$GITHUB_WORKSPACE/firmware"
          find "$target_dir" -maxdepth 1 -type f -exec cp -t "$GITHUB_WORKSPACE/firmware" -- {} +
          cp "$RUNNER_TEMP/x86-64.diffconfig" firmware/x86-64.diffconfig
          cp immortalwrt/.config firmware/x86-64.full.config
          {
            echo "上游仓库：$REPO_URL"
            echo "选定的 tag：$UPSTREAM_TAG"
            echo "上游提交：$SOURCE_COMMIT"
            echo "配置提交：$CONFIG_COMMIT"
            echo "构建时间（Asia/Shanghai）：$(date --iso-8601=seconds)"
            echo "工作流运行：$BUILD_URL"
          } > firmware/build-info.txt
          {
            echo "ImmortalWrt $UPSTREAM_TAG / x86-64"
            echo
            echo "- 手动选定的上游 tag：$UPSTREAM_TAG"
            echo "- 官方源码提交：$SOURCE_COMMIT"
            echo "- 配置提交：$CONFIG_COMMIT"
            echo '- 镜像：BIOS + UEFI；squashfs + ext4；gzip 压缩；含 Hyper-V 用的 VHDX。'
            echo '- 包含：官方 LuCI HTTPS、简体中文、luci-app-openclash、常见网卡驱动。'
            echo '- 这是基于官方源码编译的自定义固件，并非官方预编译二进制。'
            echo "- 构建详情：$BUILD_URL"
            echo
            echo '写入磁盘镜像前先解压 .img.gz。校验和以源码构建目录自带的 sha256sums 为准。'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-x86-64-${{ env.UPSTREAM_TAG }}-r${{ github.run_id }}-${{ github.run_attempt }}
          path: firmware/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: 创建草稿发布并上传全部固件
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONFIG_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" firmware/* \
            --target "$CONFIG_COMMIT" \
            --title "ImmortalWrt $UPSTREAM_TAG x86-64 固件" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest=false
          echo "固件已发布：$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传编译日志与展开后的配置
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: x86-64-build-logs-r${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/x86-64.diffconfig
            immortalwrt/.config
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
