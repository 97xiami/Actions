name: ImmortalWrt x86_64

on:
  workflow_dispatch:
    inputs:
      version:
        description: '手动输入要编译的 ImmortalWrt tag，例如 v25.12.2'
        required: true
        type: string
        default: 'v25.12.2'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt.git
  TZ: Asia/Shanghai

defaults:
  run:
    shell: bash

jobs:
  build:
    name: 编译 ImmortalWrt
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 查看服务器信息
        run: |
          echo "--------------------------CPU信息--------------------------"
          echo "CPU物理数量: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
          echo "CPU核心数量: $(nproc)"
          echo -e "CPU型号信息:$(cat /proc/cpuinfo | grep -m1 name | awk -F: '{print $2}')\n"
          echo "--------------------------内存信息--------------------------"
          echo "已安装内存详细信息:"
          echo -e "$(sudo lshw -short -C memory | grep GiB)\n"
          echo "--------------------------硬盘信息--------------------------"
          echo "硬盘数量: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

      - name: checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 安装依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: 克隆源码
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch --branch "${{ inputs.version }}" "$REPO_URL" immortalwrt

      - name: 更新并安装feeds
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 自定义配置
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          # 其余默认项交由 defconfig 自动填充。
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_VHDX_IMAGES=y
          CONFIG_PACKAGE_luci-app-openclash=y
          EOF
          make defconfig
          # 修复ERROR: package/feeds/packages/rust [host] failed to build.
          sed -i 's/--set=llvm.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/' feeds/packages/lang/rust/Makefile

      - name: 下载源码
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make download -j"$(nproc)"

      - name: 编译固件
        working-directory: immortalwrt
        run: |
          set -euo pipefail
          make -j"$(nproc)" || exit 1
          cd bin/targets/*/*
          rm -rf packages
        
      - name: 上传固件
        uses: softprops/action-gh-release@v3
        with:
          tag_name: immortalwrt-x86_64-${{ inputs.version }}
          files: $GITHUB_WORKSPACE/immortalwrt/bin/targets/x86/64
